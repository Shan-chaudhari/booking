<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ihjaz - Profile</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #f5f5f5;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #FF9500 0%, #5AC8FA 100%);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-link {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }
        
        .nav-link:hover {
            opacity: 0.8;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .profile-header {
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 60px;
            background: linear-gradient(135deg, #007AFF 0%, #5AC8FA 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 48px;
            color: white;
            font-weight: bold;
        }
        
        .user-name {
            font-size: 28px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 8px;
        }
        
        .user-email {
            font-size: 16px;
            color: #666666;
        }
        
        .section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #333333;
        }
        
        .edit-button {
            color: #007AFF;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .edit-button:hover {
            color: #5AC8FA;
        }
        
        .info-item {
            margin-bottom: 20px;
        }
        
        .info-label {
            font-size: 14px;
            color: #666666;
            margin-bottom: 4px;
        }
        
        .info-value {
            font-size: 18px;
            font-weight: 500;
            color: #333333;
        }
        
        .info-input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }
        
        .info-input:focus {
            outline: none;
            border-color: #007AFF;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }
        
        .save-button {
            background: linear-gradient(135deg, #007AFF 0%, #5AC8FA 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
            margin-top: 16px;
        }
        
        .save-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.5);
        }
        
        .menu-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .menu-item:hover {
            background: #f8f9fa;
        }
        
        .menu-item-content {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .menu-icon {
            font-size: 20px;
        }
        
        .menu-title {
            font-size: 16px;
            color: #333333;
        }
        
        .menu-arrow {
            font-size: 24px;
            color: #999999;
        }
        
        .logout-button {
            background: #FF3B30;
            color: white;
            border: none;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
            width: 100%;
        }
        
        .logout-button:hover {
            background: #D63027;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <img src="/ihjaz_logo.png" alt="Ihjaz Logo" class="logo" onerror="this.style.display='none'">
            <div class="nav-links">
                <a href="/home.html" class="nav-link">Home</a>
                <a href="/bookings-list.html" class="nav-link">My Bookings</a>
                <a href="/profile.html" class="nav-link">Profile</a>
                <a href="/settings.html" class="nav-link">Settings</a>
                <button class="logout-button" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="profile-header">
            <div class="avatar">U</div>
            <div class="user-name">User</div>
            <div class="user-email">user@example.com</div>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-title">Personal Information</div>
                <div class="edit-button" onclick="toggleEdit()">Edit</div>
            </div>
            
            <div class="info-item">
                <div class="info-label">Full Name</div>
                <div class="info-value" id="name-display">User</div>
                <input type="text" class="info-input" id="name-input" style="display: none;" value="User">
            </div>

            <div class="info-item">
                <div class="info-label">Email</div>
                <div class="info-value" id="email-display">user@example.com</div>
                <input type="email" class="info-input" id="email-input" style="display: none;" value="user@example.com">
            </div>

            <div class="info-item">
                <div class="info-label">Phone</div>
                <div class="info-value" id="phone-display">Not provided</div>
                <input type="tel" class="info-input" id="phone-input" style="display: none;" placeholder="Enter your phone">
            </div>

            <button class="save-button" id="save-button" style="display: none;" onclick="saveProfile()">Save Changes</button>
        </div>

        <div class="section">
            <div class="section-title">Settings</div>
            
            <div class="menu-item" onclick="window.location.href='/bookings-list.html'">
                <div class="menu-item-content">
                    <span class="menu-icon">📅</span>
                    <span class="menu-title">My Bookings</span>
                </div>
                <span class="menu-arrow">›</span>
            </div>

            <div class="menu-item">
                <div class="menu-item-content">
                    <span class="menu-icon">💳</span>
                    <span class="menu-title">Payment Methods</span>
                </div>
                <span class="menu-arrow">›</span>
            </div>

            <div class="menu-item" onclick="window.location.href='/settings.html'">
                <div class="menu-item-content">
                    <span class="menu-icon">⚙️</span>
                    <span class="menu-title">Settings</span>
                </div>
                <span class="menu-arrow">›</span>
            </div>

            <div class="menu-item">
                <div class="menu-item-content">
                    <span class="menu-icon">🔒</span>
                    <span class="menu-title">Privacy Policy</span>
                </div>
                <span class="menu-arrow">›</span>
            </div>

            <div class="menu-item">
                <div class="menu-item-content">
                    <span class="menu-icon">📄</span>
                    <span class="menu-title">Terms of Service</span>
                </div>
                <span class="menu-arrow">›</span>
            </div>

            <div class="menu-item">
                <div class="menu-item-content">
                    <span class="menu-icon">❓</span>
                    <span class="menu-title">Help & Support</span>
                </div>
                <span class="menu-arrow">›</span>
            </div>
        </div>

        <button class="logout-button" onclick="handleLogout()">Logout</button>
    </div>

    <script>
        let isEditing = false;

        function toggleEdit() {
            isEditing = !isEditing;
            
            const nameDisplay = document.getElementById('name-display');
            const nameInput = document.getElementById('name-input');
            const emailDisplay = document.getElementById('email-display');
            const emailInput = document.getElementById('email-input');
            const phoneDisplay = document.getElementById('phone-display');
            const phoneInput = document.getElementById('phone-input');
            const saveButton = document.getElementById('save-button');
            const editButton = document.querySelector('.edit-button');

            if (isEditing) {
                nameDisplay.style.display = 'none';
                nameInput.style.display = 'block';
                emailDisplay.style.display = 'none';
                emailInput.style.display = 'block';
                phoneDisplay.style.display = 'none';
                phoneInput.style.display = 'block';
                saveButton.style.display = 'block';
                editButton.textContent = 'Cancel';
            } else {
                nameDisplay.style.display = 'block';
                nameInput.style.display = 'none';
                emailDisplay.style.display = 'block';
                emailInput.style.display = 'none';
                phoneDisplay.style.display = 'block';
                phoneInput.style.display = 'none';
                saveButton.style.display = 'none';
                editButton.textContent = 'Edit';
            }
        }

        function saveProfile() {
            const name = document.getElementById('name-input').value;
            const email = document.getElementById('email-input').value;
            const phone = document.getElementById('phone-input').value;

            document.getElementById('name-display').textContent = name;
            document.getElementById('email-display').textContent = email;
            document.getElementById('phone-display').textContent = phone || 'Not provided';

            toggleEdit();
            alert('Profile updated successfully!');
        }

        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = '/index.html';
            }
        }
    </script>
</body>
</html>
