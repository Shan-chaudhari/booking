<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ihjaz - Home</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: #f5f5f5;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #FF9500 0%, #5AC8FA 100%);
            padding: 20px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }
        
        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }
        
        .nav-links {
            display: flex;
            gap: 20px;
        }
        
        .nav-link {
            color: white;
            text-decoration: none;
            font-weight: 600;
            transition: opacity 0.3s ease;
        }
        
        .nav-link:hover {
            opacity: 0.8;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        .welcome-section {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .greeting {
            font-size: 32px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 16px;
            color: #666666;
        }
        
        .quick-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .action-card {
            background: white;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            text-decoration: none;
            color: inherit;
        }
        
        .action-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 30px rgba(0, 122, 255, 0.2);
        }
        
        .action-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        
        .action-title {
            font-size: 20px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 8px;
        }
        
        .action-subtitle {
            font-size: 14px;
            color: #666666;
        }
        
        .section {
            background: white;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }
        
        .section-title {
            font-size: 24px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 20px;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .see-all {
            color: #007AFF;
            text-decoration: none;
            font-weight: 600;
        }
        
        .booking-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .booking-info h3 {
            font-size: 18px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 4px;
        }
        
        .booking-info p {
            font-size: 14px;
            color: #666666;
            margin-bottom: 4px;
        }
        
        .status-badge {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }
        
        .status-confirmed {
            background: #34C759;
        }
        
        .status-pending {
            background: #FF9500;
        }
        
        .logout-button {
            background: #FF3B30;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        
        .logout-button:hover {
            background: #D63027;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <img src="/ihjaz_logo.png" alt="Ihjaz Logo" class="logo" onerror="this.style.display='none'">
            <div class="nav-links">
                <a href="/home.html" class="nav-link">Home</a>
                <a href="#" class="nav-link">My Bookings</a>
                <a href="#" class="nav-link">Profile</a>
                <button class="logout-button" onclick="handleLogout()">Logout</button>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="welcome-section">
            <div class="greeting">Hello, User!</div>
            <div class="subtitle">Welcome back to Ihjaz</div>
        </div>

        <div class="quick-actions">
            <a href="#" class="action-card">
                <div class="action-icon">➕</div>
                <div class="action-title">New Booking</div>
                <div class="action-subtitle">Create a new booking</div>
            </a>

            <a href="#" class="action-card">
                <div class="action-icon">📅</div>
                <div class="action-title">My Bookings</div>
                <div class="action-subtitle">View your bookings</div>
            </a>
        </div>

        <div class="section">
            <div class="section-header">
                <div class="section-title">Upcoming Bookings</div>
                <a href="#" class="see-all">See All</a>
            </div>
            
            <div class="booking-card">
                <div class="booking-info">
                    <h3>Haircut</h3>
                    <p>May 15, 2026 at 10:00 AM</p>
                </div>
                <div class="status-badge status-confirmed">Confirmed</div>
            </div>
            
            <div class="booking-card">
                <div class="booking-info">
                    <h3>Massage</h3>
                    <p>May 18, 2026 at 2:00 PM</p>
                </div>
                <div class="status-badge status-pending">Pending</div>
            </div>
        </div>
    </div>

    <script>
        function handleLogout() {
            if (confirm('Are you sure you want to logout?')) {
                window.location.href = '/index.html';
            }
        }
    </script>
</body>
</html>
