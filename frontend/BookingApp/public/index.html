<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ihjaz - Booking App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #FF9500 0%, #5AC8FA 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 280px;
            height: 280px;
            margin: 0 auto 20px;
            object-fit: contain;
        }
        
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #666666;
        }
        
        .form {
            margin-bottom: 24px;
        }
        
        .input-container {
            margin-bottom: 20px;
        }
        
        .input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }
        
        .input:focus {
            outline: none;
            border-color: #007AFF;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }
        
        .button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #007AFF 0%, #5AC8FA 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.5);
        }
        
        .button:active {
            transform: translateY(0);
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
        }
        
        .footer-text {
            color: #666666;
            font-size: 14px;
        }
        
        .link-text {
            color: #007AFF;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin-left: 5px;
            transition: color 0.3s ease;
        }
        
        .link-text:hover {
            color: #5AC8FA;
            text-decoration: underline;
        }
        
        .forgot-password {
            text-align: center;
            margin-top: 16px;
        }
        
        .forgot-password-text {
            color: #007AFF;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        
        .forgot-password-text:hover {
            color: #5AC8FA;
            text-decoration: underline;
        }
        
        .notification-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 1000;
        }
        
        .notification {
            background: white;
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.3s ease;
            max-width: 350px;
        }
        
        .notification.success {
            border-left: 4px solid #34C759;
        }
        
        .notification.error {
            border-left: 4px solid #FF3B30;
        }
        
        .notification.info {
            border-left: 4px solid #007AFF;
        }
        
        .notification-icon {
            font-size: 20px;
        }
        
        .notification-content {
            flex: 1;
        }
        
        .notification-title {
            font-size: 14px;
            font-weight: 600;
            color: #333333;
            margin-bottom: 4px;
        }
        
        .notification-message {
            font-size: 12px;
            color: #666666;
        }
        
        .notification-close {
            cursor: pointer;
            font-size: 18px;
            color: #999999;
            transition: color 0.3s ease;
        }
        
        .notification-close:hover {
            color: #333333;
        }
        
        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOut {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div class="notification-container" id="notificationContainer"></div>
    
    <div class="container">
        <div class="header">
            <img src="/ihjaz_logo.png" alt="Ihjaz Logo" class="logo" onerror="this.style.display='none'">
            <div class="title">Welcome Back</div>
            <div class="subtitle">Sign in to your Ihjaz account</div>
        </div>

        <div class="form">
            <div class="input-container">
                <input type="email" class="input" placeholder="Email address" id="email">
            </div>

            <div class="input-container">
                <input type="password" class="input" placeholder="Password" id="password">
            </div>

            <button class="button" onclick="handleLogin()">Sign In</button>
            
            <div class="forgot-password">
                <a href="#" class="forgot-password-text">Forgot Password?</a>
            </div>
        </div>

        <div class="footer">
            <span class="footer-text">Don't have an account?</span>
            <a href="/register.html" class="link-text">Sign Up</a>
        </div>
    </div>

    <script>
        function showNotification(type, title, message) {
            const container = document.getElementById('notificationContainer');
            const notification = document.createElement('div');
            notification.className = `notification ${type}`;
            
            const icons = {
                success: '✓',
                error: '✕',
                info: 'ℹ'
            };
            
            notification.innerHTML = `
                <div class="notification-icon">${icons[type]}</div>
                <div class="notification-content">
                    <div class="notification-title">${title}</div>
                    <div class="notification-message">${message}</div>
                </div>
                <div class="notification-close" onclick="this.parentElement.remove()">×</div>
            `;
            
            container.appendChild(notification);
            
            // Auto remove after 5 seconds
            setTimeout(() => {
                notification.style.animation = 'slideOut 0.3s ease';
                setTimeout(() => notification.remove(), 300);
            }, 5000);
        }

        async function handleLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            if (!email) {
                showNotification('error', 'Error', 'Please enter your email address');
                return;
            }
            
            if (!password) {
                showNotification('error', 'Error', 'Please enter your password');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8000/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email, password }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store token in localStorage
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    showNotification('success', 'Success', 'Login successful!');
                    setTimeout(() => window.location.href = '/home.html', 1000);
                } else {
                    showNotification('error', 'Error', data.detail || 'Login failed');
                }
            } catch (error) {
                console.error('Login error:', error);
                showNotification('error', 'Error', 'Login failed. Please try again.');
            }
        }
    </script>
</body>
</html>
