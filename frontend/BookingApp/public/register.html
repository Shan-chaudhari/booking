<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ihjaz - Sign Up</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            background: linear-gradient(135deg, #FF9500 0%, #5AC8FA 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 20px;
            padding: 40px;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }
        
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .logo {
            width: 280px;
            height: 280px;
            margin: 0 auto 20px;
            object-fit: contain;
        }
        
        .title {
            font-size: 28px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 8px;
        }
        
        .subtitle {
            font-size: 14px;
            color: #666666;
        }
        
        .form {
            margin-bottom: 24px;
        }
        
        .input-container {
            margin-bottom: 16px;
        }
        
        .input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 16px;
            background-color: #fafafa;
            transition: all 0.3s ease;
        }
        
        .input:focus {
            outline: none;
            border-color: #007AFF;
            background-color: white;
            box-shadow: 0 0 0 3px rgba(0, 122, 255, 0.1);
        }
        
        .checkbox-container {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .checkbox {
            width: 20px;
            height: 20px;
            margin-right: 10px;
            cursor: pointer;
        }
        
        .terms-text {
            font-size: 14px;
            color: #666666;
        }
        
        .terms-link {
            color: #007AFF;
            text-decoration: none;
            font-weight: 600;
        }
        
        .button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #007AFF 0%, #5AC8FA 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 122, 255, 0.4);
        }
        
        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 122, 255, 0.5);
        }
        
        .footer {
            text-align: center;
            margin-top: 24px;
        }
        
        .footer-text {
            color: #666666;
            font-size: 14px;
        }
        
        .link-text {
            color: #007AFF;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            margin-left: 5px;
            transition: color 0.3s ease;
        }
        
        .link-text:hover {
            color: #5AC8FA;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <img src="/ihjaz_logo.png" alt="Ihjaz Logo" class="logo" onerror="this.style.display='none'">
            <div class="title">Create Account</div>
            <div class="subtitle">Sign up to get started with Ihjaz</div>
        </div>

        <div class="form">
            <div class="input-container">
                <input type="text" class="input" placeholder="Full Name" id="name">
            </div>

            <div class="input-container">
                <input type="email" class="input" placeholder="Email address" id="email">
            </div>

            <div class="input-container">
                <input type="password" class="input" placeholder="Password" id="password">
            </div>

            <div class="input-container">
                <input type="password" class="input" placeholder="Confirm Password" id="confirmPassword">
            </div>

            <div class="checkbox-container">
                <input type="checkbox" class="checkbox" id="terms">
                <span class="terms-text">I agree to the <a href="#" class="terms-link">Terms and Conditions</a></span>
            </div>

            <button class="button" onclick="handleRegister()">Sign Up</button>
        </div>

        <div class="footer">
            <span class="footer-text">Already have an account?</span>
            <a href="/index.html" class="link-text">Sign In</a>
        </div>
    </div>

    <script>
        async function handleRegister() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const terms = document.getElementById('terms').checked;
            
            if (!name) {
                alert('Please enter your name');
                return;
            }
            
            if (!email) {
                alert('Please enter your email address');
                return;
            }
            
            if (!password) {
                alert('Please enter your password');
                return;
            }
            
            if (password !== confirmPassword) {
                alert('Passwords do not match');
                return;
            }
            
            if (!terms) {
                alert('Please agree to the terms and conditions');
                return;
            }
            
            try {
                const response = await fetch('http://localhost:8000/api/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ name, email, password }),
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    // Store token in localStorage
                    localStorage.setItem('token', data.access_token);
                    localStorage.setItem('user', JSON.stringify(data.user));
                    alert('Registration successful!');
                    window.location.href = '/home.html';
                } else {
                    alert(data.detail || 'Registration failed');
                }
            } catch (error) {
                console.error('Registration error:', error);
                alert('Registration failed. Please try again.');
            }
        }
    </script>
</body>
</html>
